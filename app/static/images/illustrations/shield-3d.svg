<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 680" role="img" aria-labelledby="t d">
  <title id="t">Escudo 3D conceptual</title>
  <desc id="d">Ilustración de un escudo facetado de cristal violeta con un candado luminoso. Es un recurso decorativo y no representa una certificación.</desc>
  <defs>
    <linearGradient id="faceL" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9bcff"/><stop offset=".35" stop-color="#a24bff"/><stop offset="1" stop-color="#5a0c9c"/></linearGradient>
    <linearGradient id="faceR" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8d2fe3"/><stop offset=".5" stop-color="#4a0b8c"/><stop offset="1" stop-color="#1a0638"/></linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d1236"/><stop offset="1" stop-color="#07040f"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".4" stop-color="#d9bcff" stop-opacity=".3"/><stop offset="1" stop-color="#a24bff" stop-opacity="0"/></linearGradient>
    <linearGradient id="lock" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#cdb4f5"/></linearGradient>
    <radialGradient id="floor" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#a24bff" stop-opacity=".6"/><stop offset="1" stop-color="#820ad1" stop-opacity="0"/></radialGradient>
    <radialGradient id="halo" cx="50%" cy="48%" r="50%"><stop offset="0" stop-color="#a24bff" stop-opacity=".55"/><stop offset="1" stop-color="#820ad1" stop-opacity="0"/></radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".4"/><stop offset=".35" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <filter id="blur30" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="blur6" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <clipPath id="left"><rect x="0" y="0" width="300" height="680"/></clipPath>
    <clipPath id="right"><rect x="300" y="0" width="300" height="680"/></clipPath>
  </defs>
  <style>
    .ring{transform-origin:300px 330px;transform-box:view-box;animation:spin 40s linear infinite}
    .ring2{transform-origin:300px 330px;transform-box:view-box;animation:spin 60s linear infinite reverse}
    .bob{animation:bob 6.5s ease-in-out infinite}
    .pulse{animation:pulse 3.6s ease-in-out infinite alternate}
    .scan{animation:scan 5s ease-in-out infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
    @keyframes pulse{from{opacity:.55}to{opacity:1}}
    @keyframes scan{0%{transform:translateY(-120px);opacity:0}20%,80%{opacity:.9}100%{transform:translateY(300px);opacity:0}}
    @media (prefers-reduced-motion:reduce){.ring,.ring2,.bob,.pulse,.scan{animation:none}}
  </style>
  <ellipse cx="300" cy="640" rx="230" ry="30" fill="url(#floor)" filter="url(#blur30)" class="pulse"/>
  <ellipse cx="300" cy="630" rx="170" ry="14" fill="#000" opacity=".6" filter="url(#blur6)"/>
  <g class="bob">
    <circle cx="300" cy="330" r="270" fill="url(#halo)" class="pulse"/>
    <g class="ring" fill="none"><ellipse cx="300" cy="330" rx="292" ry="84" stroke="#d9bcff" stroke-opacity=".5" stroke-width="1.3" stroke-dasharray="2 8"/><circle cx="592" cy="330" r="6" fill="#fff"/></g>
    <g class="ring2" fill="none"><ellipse cx="300" cy="330" rx="250" ry="250" stroke="#a24bff" stroke-opacity=".28" stroke-width="1.2"/><circle cx="300" cy="80" r="5" fill="#a24bff"/></g>
    <!-- grosor -->
    <path d="M300 36C376 88 468 108 540 114V300C540 440 440 540 300 604C160 540 60 440 60 300V114C132 108 224 88 300 36Z" transform="translate(0 22)" fill="#12082a"/>
    <!-- caras -->
    <path d="M300 36C376 88 468 108 540 114V300C540 440 440 540 300 604C160 540 60 440 60 300V114C132 108 224 88 300 36Z" fill="url(#faceL)" clip-path="url(#left)"/>
    <path d="M300 36C376 88 468 108 540 114V300C540 440 440 540 300 604C160 540 60 440 60 300V114C132 108 224 88 300 36Z" fill="url(#faceR)" clip-path="url(#right)"/>
    <path d="M300 36C376 88 468 108 540 114V300C540 440 440 540 300 604C160 540 60 440 60 300V114C132 108 224 88 300 36Z" fill="url(#sheen)"/>
    <path d="M300 36C376 88 468 108 540 114V300C540 440 440 540 300 604C160 540 60 440 60 300V114C132 108 224 88 300 36Z" fill="none" stroke="url(#edge)" stroke-width="3"/>
    <!-- núcleo de cristal -->
    <path d="M300 96C360 134 428 152 486 158V296C486 404 410 480 300 532C190 480 114 404 114 296V158C172 152 240 134 300 96Z" fill="url(#core)"/>
    <path d="M300 96C360 134 428 152 486 158V296C486 404 410 480 300 532C190 480 114 404 114 296V158C172 152 240 134 300 96Z" fill="none" stroke="#d9bcff" stroke-opacity=".35" stroke-width="2"/>
    <path d="M300 96V532" stroke="#a24bff" stroke-opacity=".18" stroke-width="1.5"/>
    <g opacity=".7"><path d="M114 296H486" stroke="#a24bff" stroke-opacity=".12" stroke-width="1.2"/><path d="M160 214H440M160 378H440" stroke="#a24bff" stroke-opacity=".1" stroke-width="1"/></g>
    <!-- candado -->
    <g class="pulse">
      <circle cx="300" cy="318" r="86" fill="#a24bff" opacity=".22" filter="url(#blur6)"/>
    </g>
    <path d="M254 306V284C254 258 272 240 300 240C328 240 346 258 346 284V306" fill="none" stroke="url(#lock)" stroke-width="16" stroke-linecap="round"/>
    <rect x="232" y="296" width="136" height="104" rx="24" fill="url(#lock)"/>
    <rect x="232" y="296" width="136" height="104" rx="24" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="2"/>
    <circle cx="300" cy="338" r="13" fill="#6a08ab"/>
    <rect x="293" y="338" width="14" height="38" rx="7" fill="#6a08ab"/>
    <!-- barrido de lectura -->
    <g clip-path="url(#left)"><rect x="130" y="160" width="340" height="3" fill="#d9bcff" opacity=".0"/></g>
    <rect x="120" y="170" width="360" height="2" fill="#fff" opacity=".55" class="scan" filter="url(#blur6)"/>
  </g>
</svg>
