<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 640" role="img" aria-labelledby="t d">
  <title id="t">Brújula 3D de Norte</title>
  <desc id="d">Ilustración conceptual de una brújula oscura con luz violeta y una aguja que oscila suavemente.</desc>
  <defs>
    <radialGradient id="floor" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#a24bff" stop-opacity=".55"/><stop offset="1" stop-color="#820ad1" stop-opacity="0"/></radialGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a1a4d"/><stop offset="1" stop-color="#05030a"/></linearGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a2569"/><stop offset=".45" stop-color="#150d2b"/><stop offset="1" stop-color="#0a0616"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9bcff"/><stop offset=".35" stop-color="#a24bff" stop-opacity=".7"/><stop offset=".7" stop-color="#820ad1" stop-opacity="0"/></linearGradient>
    <linearGradient id="rim2" x1="1" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#a24bff" stop-opacity=".55"/><stop offset=".5" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
    <radialGradient id="dial" cx="42%" cy="35%" r="75%"><stop offset="0" stop-color="#2b1a55"/><stop offset=".55" stop-color="#120a26"/><stop offset="1" stop-color="#07040f"/></radialGradient>
    <linearGradient id="north" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2c6ff"/><stop offset=".5" stop-color="#a24bff"/><stop offset="1" stop-color="#6a08ab"/></linearGradient>
    <linearGradient id="south" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#9a97aa"/><stop offset="1" stop-color="#f4f2fb"/></linearGradient>
    <radialGradient id="cap" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#ffffff"/><stop offset=".4" stop-color="#cfc3e6"/><stop offset="1" stop-color="#4d3a78"/></radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".34"/><stop offset=".42" stop-color="#fff" stop-opacity=".05"/><stop offset=".43" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <filter id="blur24" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="blur6" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="blur2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
    <clipPath id="dialClip"><circle cx="300" cy="300" r="214"/></clipPath>
  </defs>
  <style>
    .sway{transform-origin:300px 300px;transform-box:view-box;animation:sway 7s ease-in-out infinite alternate}
    .orbit{transform-origin:300px 300px;transform-box:view-box;animation:orbit 38s linear infinite}
    .orbit2{transform-origin:300px 300px;transform-box:view-box;animation:orbit 52s linear infinite reverse}
    .bob{animation:bob 6s ease-in-out infinite}
    .glow{animation:glow 5s ease-in-out infinite alternate}
    @keyframes sway{from{transform:rotate(-14deg)}to{transform:rotate(9deg)}}
    @keyframes orbit{to{transform:rotate(360deg)}}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    @keyframes glow{from{opacity:.6}to{opacity:1}}
    @media (prefers-reduced-motion:reduce){.sway,.orbit,.orbit2,.bob,.glow{animation:none}}
  </style>
