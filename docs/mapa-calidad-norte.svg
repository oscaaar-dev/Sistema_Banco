<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1320" viewBox="0 0 1500 1320" role="img" aria-labelledby="title desc">
  <title id="title">Mapa conceptual: herramientas para mejorar la calidad de Norte</title>
  <desc id="desc">Infografía con seis áreas de calidad aplicadas al proyecto Norte y herramientas actuales o recomendadas.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef5ff"/><stop offset=".55" stop-color="#f8faff"/><stop offset="1" stop-color="#fff4eb"/></linearGradient>
    <linearGradient id="root" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10377f"/><stop offset="1" stop-color="#0758bd"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff762f"/><stop offset="1" stop-color="#ff9b45"/></linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#173e7a" flood-opacity=".11"/></filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#a9bfdc" opacity=".35"/></pattern>
    <style>
      text{font-family:Inter,Arial,sans-serif}.eyebrow{font-size:15px;font-weight:800;letter-spacing:3px}.title{font-size:46px;font-weight:800;letter-spacing:-1.7px}.subtitle{font-size:19px}.root-title{font-size:23px;font-weight:800}.root-sub{font-size:15px}.card-title{font-size:22px;font-weight:800;letter-spacing:-.4px}.card-body{font-size:16px}.tag{font-size:11px;font-weight:800;letter-spacing:1.2px}.footer{font-size:14px}
    </style>
  </defs>
  <rect width="1500" height="1210" fill="url(#bg)"/>
  <rect width="1500" height="1210" fill="url(#dots)" opacity=".55"/>
  <circle cx="1430" cy="80" r="185" fill="#ff8a3d" opacity=".08"/>
  <circle cx="65" cy="1080" r="220" fill="#1655ad" opacity=".06"/>

  <text x="750" y="67" text-anchor="middle" class="eyebrow" fill="#f2762a">PROYECTO NORTE · CALIDAD</text>
  <text x="750" y="125" text-anchor="middle" class="title" fill="#103575">Herramientas para mejorar</text>
  <text x="750" y="177" text-anchor="middle" class="title" fill="#103575">la calidad de un proyecto</text>
  <text x="750" y="212" text-anchor="middle" class="subtitle" fill="#64748b">Cómo se aplican al desarrollo, las pruebas y la operación de Norte</text>

  <!-- Conectores conceptuales -->
  <g fill="none" stroke="#9bb4d5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".85">
    <path d="M750 330 V365 H270 V404"/><path d="M750 365 V404"/><path d="M750 365 H1230 V404"/>
    <path d="M270 744 V790"/><path d="M750 744 V790"/><path d="M1230 744 V790"/>
  </g>
  <g fill="#ff7b32"><circle cx="270" cy="404" r="6"/><circle cx="750" cy="404" r="6"/><circle cx="1230" cy="404" r="6"/></g>
  <g fill="#1655ad"><circle cx="270" cy="725" r="6"/><circle cx="750" cy="725" r="6"/><circle cx="1230" cy="725" r="6"/></g>

  <!-- Nodo principal -->
  <g filter="url(#shadow)">
    <rect x="495" y="238" width="510" height="112" rx="25" fill="url(#root)"/>
    <rect x="495" y="238" width="8" height="112" rx="4" fill="url(#accent)"/>
  </g>
  <circle cx="548" cy="294" r="24" fill="#ffffff" opacity=".14"/>
  <path d="M538 294l7 7 14-16" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="590" y="288" class="root-title" fill="#fff">CALIDAD DEL PROYECTO NORTE</text>
  <text x="590" y="316" class="root-sub" fill="#d5e5ff">Se construye, se comprueba y se mejora continuamente</text>

  <!-- Tarjeta 1 -->
  <g filter="url(#shadow)"><rect x="60" y="404" width="420" height="340" rx="23" fill="#fff"/></g>
  <rect x="60" y="404" width="420" height="8" rx="4" fill="#f2762a"/>
  <circle cx="103" cy="455" r="22" fill="#fff0e5"/><text x="103" y="462" text-anchor="middle" font-size="20" font-weight="800" fill="#e76a22">01</text>
  <text x="140" y="462" class="card-title" fill="#143a7b">Planificación y colaboración</text>
  <text x="90" y="510" class="card-body" fill="#52647d"><tspan x="90">Organizan tareas, prioridades y cambios</tspan><tspan x="90" dy="25">para que el equipo avance con claridad.</tspan></text>
  <rect x="90" y="574" width="142" height="29" rx="14" fill="#fff0e5"/><text x="161" y="593" text-anchor="middle" class="tag" fill="#bd5a20">USO ACTUAL</text>
  <text x="90" y="630" class="card-body" font-weight="700" fill="#193d7e">Git · ramas de trabajo</text>
  <text x="90" y="657" class="card-body" fill="#64748b">Mejora posible: tablero Kanban.</text>
  <text x="90" y="684" class="card-body" fill="#64748b">Aporta historial y trazabilidad de cambios.</text>

  <!-- Tarjeta 2 -->
  <g filter="url(#shadow)"><rect x="540" y="404" width="420" height="340" rx="23" fill="#fff"/></g>
  <rect x="540" y="404" width="420" height="8" rx="4" fill="#2366c4"/>
  <circle cx="583" cy="455" r="22" fill="#eaf2ff"/><text x="583" y="462" text-anchor="middle" font-size="20" font-weight="800" fill="#1d5eb8">02</text>
  <text x="620" y="462" class="card-title" fill="#143a7b">Calidad del código</text>
  <text x="570" y="510" class="card-body" fill="#52647d"><tspan x="570">Una estructura clara facilita mantener</tspan><tspan x="570" dy="25">y ampliar el sistema con menos errores.</tspan></text>
  <rect x="570" y="574" width="142" height="29" rx="14" fill="#eaf2ff"/><text x="641" y="593" text-anchor="middle" class="tag" fill="#1b58a9">USO ACTUAL</text>
  <text x="570" y="630" class="card-body" font-weight="700" fill="#193d7e">Python · Flask · SQLAlchemy</text>
  <text x="570" y="657" class="card-body" fill="#64748b">Mejora posible: Ruff (análisis estático).</text>
  <text x="570" y="684" class="card-body" fill="#64748b">Aporta consistencia y detección temprana.</text>

  <!-- Tarjeta 3 -->
  <g filter="url(#shadow)"><rect x="1020" y="404" width="420" height="340" rx="23" fill="#fff"/></g>
  <rect x="1020" y="404" width="420" height="8" rx="4" fill="#438a76"/>
  <circle cx="1063" cy="455" r="22" fill="#e9f6f1"/><text x="1063" y="462" text-anchor="middle" font-size="20" font-weight="800" fill="#34816c">03</text>
  <text x="1100" y="462" class="card-title" fill="#143a7b">Pruebas del sistema</text>
  <text x="1050" y="510" class="card-body" fill="#52647d"><tspan x="1050">Comprueban reglas del servidor y flujos</tspan><tspan x="1050" dy="25">reales de navegación en la web.</tspan></text>
  <rect x="1050" y="574" width="142" height="29" rx="14" fill="#e9f6f1"/><text x="1121" y="593" text-anchor="middle" class="tag" fill="#347b68">USO ACTUAL</text>
  <text x="1050" y="630" class="card-body" font-weight="700" fill="#193d7e">pytest: 64 pruebas de lógica</text>
  <text x="1050" y="657" class="card-body" fill="#64748b">Playwright: 12 recorridos E2E.</text>
  <text x="1050" y="684" class="card-body" fill="#64748b">Aportan detección de regresiones.</text>

  <!-- Tarjeta 4 -->
  <g filter="url(#shadow)"><rect x="60" y="790" width="420" height="340" rx="23" fill="#fff"/></g>
  <rect x="60" y="790" width="420" height="8" rx="4" fill="#725dc4"/>
  <circle cx="103" cy="841" r="22" fill="#f0edff"/><text x="103" y="848" text-anchor="middle" font-size="20" font-weight="800" fill="#6552b2">04</text>
  <text x="140" y="848" class="card-title" fill="#143a7b">Seguridad</text>
  <text x="90" y="896" class="card-body" fill="#52647d"><tspan x="90">Reduce riesgos en el acceso y protege</tspan><tspan x="90" dy="25">las acciones realizadas en el sistema.</tspan></text>
  <rect x="90" y="960" width="142" height="29" rx="14" fill="#f0edff"/><text x="161" y="979" text-anchor="middle" class="tag" fill="#5e50aa">USO ACTUAL</text>
  <text x="90" y="1016" class="card-body" font-weight="700" fill="#193d7e">CSRF · hash de contraseñas · OTP</text>
  <text x="90" y="1043" class="card-body" fill="#64748b">Límites de intentos y cabeceras.</text>
  <text x="90" y="1070" class="card-body" fill="#64748b">Aporta defensa ante abuso y falsificación.</text>

  <!-- Tarjeta 5 -->
  <g filter="url(#shadow)"><rect x="540" y="790" width="420" height="340" rx="23" fill="#fff"/></g>
  <rect x="540" y="790" width="420" height="8" rx="4" fill="#258c9c"/>
  <circle cx="583" cy="841" r="22" fill="#e4f6f8"/><text x="583" y="848" text-anchor="middle" font-size="20" font-weight="800" fill="#167c8a">05</text>
  <text x="620" y="848" class="card-title" fill="#143a7b">Datos e integraciones</text>
  <text x="570" y="896" class="card-body" fill="#52647d"><tspan x="570">Conectan la aplicación con datos y</tspan><tspan x="570" dy="25">servicios externos de forma controlada.</tspan></text>
  <rect x="570" y="960" width="142" height="29" rx="14" fill="#e4f6f8"/><text x="641" y="979" text-anchor="middle" class="tag" fill="#167482">USO ACTUAL</text>
  <text x="570" y="1016" class="card-body" font-weight="700" fill="#193d7e">SQLAlchemy · compatible con MySQL</text>
  <text x="570" y="1043" class="card-body" fill="#64748b">Staging Railway: PostgreSQL.</text>
  <text x="570" y="1070" class="card-body" fill="#64748b">Pruebas: SQLite · códigos: Brevo.</text>

  <!-- Tarjeta 6 -->
  <g filter="url(#shadow)"><rect x="1020" y="790" width="420" height="340" rx="23" fill="#fff"/></g>
  <rect x="1020" y="790" width="420" height="8" rx="4" fill="#d87432"/>
  <circle cx="1063" cy="841" r="22" fill="#fff0e5"/><text x="1063" y="848" text-anchor="middle" font-size="20" font-weight="800" fill="#bd5b24">06</text>
  <text x="1100" y="848" class="card-title" fill="#143a7b">Despliegue y seguimiento</text>
  <text x="1050" y="896" class="card-body" fill="#52647d"><tspan x="1050">Permite revisar la versión publicada</tspan><tspan x="1050" dy="25">antes de promoverla a producción.</tspan></text>
  <rect x="1050" y="960" width="142" height="29" rx="14" fill="#fff0e5"/><text x="1121" y="979" text-anchor="middle" class="tag" fill="#bd5b24">USO ACTUAL</text>
  <text x="1050" y="1016" class="card-body" font-weight="700" fill="#193d7e">Railway · entorno staging</text>
  <text x="1050" y="1043" class="card-body" fill="#64748b">Revisar estado, logs y respuesta.</text>
  <text x="1050" y="1070" class="card-body" fill="#64748b">Producción requiere autorización aparte.</text>

  <rect x="60" y="1160" width="1380" height="92" rx="20" fill="#10377f"/>
  <circle cx="101" cy="1206" r="17" fill="#ff8a3d"/><text x="101" y="1212" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">+</text>
  <text x="134" y="1197" font-size="16" font-weight="800" fill="#fff">SIGUIENTES PASOS RECOMENDADOS</text>
  <text x="134" y="1225" font-size="15" fill="#d8e6fb">Automatizar pruebas por cambio · medir cobertura · usar tablero Kanban · revisar logs en staging.</text>
  <text x="1400" y="1196" text-anchor="end" class="tag" fill="#ffbd91">MEJORA FUTURA</text>
  <text x="750" y="1290" text-anchor="middle" class="footer" fill="#71819a">Mapa adaptado a las herramientas verificadas en Norte · Las mejoras futuras están identificadas como recomendaciones.</text>
</svg>
